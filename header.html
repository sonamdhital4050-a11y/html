<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <style>
         nav ul{
            list-style:none;
            margin: 12px;;
            padding: 12px;;
            display:flex;
        }
        header{
            background-color: rgb(42, 50, 47);
            color:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 50px;
        }
         nav ul li{
            margin-left:20px;
        }

        nav ul li a{
            text-decoration:none;
            color:rgb(221, 237, 38);
            font: size 24px;
        }

        nav ul li a:hover{
            color:#ce0610;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">MyLogo</div>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    </header>
    <hr>
</body>
</html>
