<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main-box {
            border: 1px solid black;
            display: flex;
            flex-direction: row;
            height: 500px;
            justify-content: center;
        }
        .box{
            height: 60px;
            background-color: brown;
            width: 60px;
            margin: 10px;
            border-radius: 12px;
        }
        #box1{
            background-color: blue;
        }
        #box2{
            background-color: rgb(208, 18, 186);
        }
        #box3{
            background-color: rgb(3, 182, 12);
        }
        #box4{
            background-color: rgb(227, 154, 16);
        }
        .btn{
            height: 40px;
            width: 128px;
            background-color: aqua;
            border-radius: 12px;
            box-sizing: border-box;
            color: azure;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;

        }
    </style>
</head>
<body>
    <h1>Flexbox in css</h1>
<div class="main-box">
        <div class="box" id="box1">1</div>
    <div class="box" id="box2">2</div>
    <div class="box" id="box3">3</div>
    <div class="box" id="box4">4</div>
</div>
<button class="btn">click me</button>
</body>
</html>
